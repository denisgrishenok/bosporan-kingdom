<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="История Боспорского царства от основания греческих полисов на берегах Керченского пролива до вхождения в состав Византийской империи">
    <link rel="icon" type="image/svg+xml" href="/logo/favicon.svg">
    <title>Боспорское царство</title>
    <meta property="og:title" content="Боспорское царство">
    <meta property="og:description" content="История Боспорского царства от основания греческих полисов на берегах Керченского пролива до вхождения в состав Византийской империи">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/images/og-image.png">
    <meta property="og:url" content="https://...">
    <script type="module" src="./src/scripts/main.js"></script>
</head>
<body>
    <header class="header">  
        <div class="header__container">     
            <a class="header__link"    
                href="#section-intro"
                aria-label="Home"
                title="Наверх страницы">
                <img src="/logo/LOGO-desktop.svg" alt="bosporoy logo" class="logo" aria-hidden="true">    
            </a>
            <div class="header__search search">
                <form class="search__form" 
                    role="search" 
                    autocomplete="off">
                    <div class="search__wrapper">
                        <input class="search__input"
                            name="q" 
                            type="search"
                            autocorrect="off"
                            autocapitalize="off"
                            spellcheck="false" 
                            aria-label="Поиск по сайту"
                            placeholder="Поиск">
                        <div class="search__icon-slot">
                            <button class="search__clear"
                            type="button"
                            aria-label="Очистить поиск">
                                <svg class="icon" width="18px" height="18px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M7 17L16.8995 7.10051" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M7 7.00001L16.8995 16.8995" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                            <span class="search__submit">
                                <svg class="icon" width="16px" height="16px" aria-hidden="true" viewBox="0 0 32 32" version="1.1" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M31.707 30.282l-9.717-9.776c1.811-2.169 2.902-4.96 2.902-8.007 0-6.904-5.596-12.5-12.5-12.5s-12.5 5.596-12.5 12.5 5.596 12.5 12.5 12.5c3.136 0 6.002-1.158 8.197-3.067l9.703 9.764c0.39 0.39 1.024 0.39 1.415 0s0.39-1.023 0-1.415zM12.393 23.016c-5.808 0-10.517-4.709-10.517-10.517s4.708-10.517 10.517-10.517c5.808 0 10.516 4.708 10.516 10.517s-4.709 10.517-10.517 10.517z"></path>
                                </svg>
                            </span>
                        </div>
                    </div>
                </form>
                <div class="search__result">
                    <ul class="search__list">
                    </ul>
                </div>
            </div>
            <nav class="header__menu">
                <ul class="header__menu-list">
                    <li class="header__menu-item header__menu-item--dropdown">
                        <button 
                            class="header__button" 
                            type="button"
                            aria-expanded="false"
                            aria-controls="header-dropdown" 
                            title="Открыть список разделов">
                                меню
                            <span class="visually-hidden">
                                Открыть список разделов
                            </span>
                        </button>
                        <div class="header__dropdown" id="header-dropdown"></div>
                    </li>
                </ul>
            </nav>       
        </div>   
    </header>
    <div class="header__overlay"></div>
    <main class="content">
        <!-- include:src/html/intro.html -->
        <!-- include:src/html/kimmeric.html -->
        <!-- include:src/html/spartok.html -->
        <!-- include:src/html/mitridat.html -->
        <!-- include:src/html/tibery.html -->
        <!-- include:src/html/late.html -->
        <!-- include:src/html/appendix.html -->
    </main>
    <!-- include:src/html/footer.html -->
    <div class="modal">
        <div class="modal__overlay" data-close=""></div>
        <div class="modal__window" 
            role="dialog"
            aria-modal="true"
            aria-label="Окно просмотра"
            tabindex="-1">
            <div class="modal__viewer">
                <img class="modal__img" alt="">
            </div>
            <div class="modal__controls">
                <button class="modal__button zoom" type="button"
                    aria-label="Уменьшить масштаб">
                    <svg class="modal__icon" width="24px" height="24px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="24" height="24" fill="none"/>
                        <path d="M7 12L17 12" stroke-linecap="round" stroke-linejoin="round"/>                        
                    </svg>
                </button>
                <button class="modal__button zoom" type="button"
                    aria-label="Увеличить масштаб">
                    <svg class="modal__icon" width="24px" height="24px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="24" height="24" fill="none"/>
                        <path d="M7 12L17 12" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 7L12 17" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <button class="modal__button" type="button"
                    aria-label="Закрыть окно просмотра">
                    <svg class="modal__icon" width="24px" height="24px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="24" height="24" fill="none"/>
                        <path d="M7 17L16.8995 7.10051" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M7 7.00001L16.8995 16.8995" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
