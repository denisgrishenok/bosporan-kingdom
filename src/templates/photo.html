<button type="button" class="picture--open" aria-label="Открыть: {{alt}}">
    <picture>
        <source srcset="{{avif}}"
        type="image/avif">
        <img class="{{imgClass}}" 
        src="{{src}}"
        alt="{{alt}}"
        loading="lazy"
        decoding="async" 
        width="{{width}}" height="{{height}}">
    </picture>
</button>
